# ========
# Terminal Settings
# ========
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -g focus-events on
set-option -ga terminal-overrides ",*256col*:Tc"

# ========
# General
# ========
unbind C-b
set -g prefix C-a
bind-key C-a last-window
set -g renumber-windows on
set -g history-limit 10000
setw -g mouse on

# ========
# Theme (Gruvbox Dark)
# ========
set -g status-justify "left"
set -g status-style "bg=default,fg=colour248"
set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left "#[fg=colour235,bg=colour208,bold] #S #[fg=colour208,bg=default,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=colour239,bg=default,nobold,nounderscore,noitalics]#[fg=colour248,bg=colour239] %Y-%m-%d  %H:%M #[fg=colour208,bg=colour239,nobold,nounderscore,noitalics]#[fg=colour235,bg=colour208,bold] #h "

setw -g window-status-format "#[fg=colour248,bg=default] #I  #W "
setw -g window-status-current-format "#[fg=default,bg=colour239,nobold,nounderscore,noitalics]#[fg=colour248,bg=colour239] #I  #W #[fg=colour239,bg=default,nobold,nounderscore,noitalics]"

# Pane borders
set -g pane-border-style "fg=colour239"
set -g pane-active-border-style "fg=colour208"

# Message text
set -g message-style "bg=colour239,fg=colour248"

# ========
# Plugins
# ========
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager
if-shell "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"
