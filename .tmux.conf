# ========
# Terminal Settings
# ========
# Use tmux-256color instead of screen-256color for better color support
set -g default-terminal "tmux-256color"
# Enable RGB color support and Italics
set-option -sa terminal-overrides ',xterm-256color:RGB,sitm=\E[3m'
# Enable focus events for better vim integration
set-option -g focus-events on  # for vim/tmux buffer sync

# Use the 24-bit color capability of the terminal (true color support)
set-option -ga terminal-overrides ",*256col*:Tc"
# Fix for Vim colors specifically
set-option -ga terminal-overrides ",*:Tc"
set-option -ga terminal-overrides ",*:RGB"

# Preserve environment variables
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM COLORTERM"

# Vim-specific fixes
set-option -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors

# ========
# General
# ========
unbind C-b
unbind C-a
set -g prefix C-a

# General settings
# ========

# use a different prefix for nested
bind-key -n C-y send-prefix

# add double-tap meta key to toggle last window
bind-key C-a last-window

# Renumber windows after closing any window.
set -g renumber-windows on
# Use a more helpful scroll history size.
set -g history-limit 10000

# Status line; look for tmuxline in ~/.vimrc.
setenv -g TMUX_PROFILE $ITERM_PROFILE
#is_light='[ "$TMUX_PROFILE" = "light" ]'
#tmuxline_dark="~/.tmux/tmuxline-dark.conf"
#tmuxline_light="~/.tmux/tmuxline-light.conf"
setw -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

#Add Pomodoro plugin
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# --- Pomodoro Plus Settings ---
# Enable desktop notifications
set -g @pomodoro_notifications 'on'
# Disable sound (optional, you can set it to 'on')
set -g @pomodoro_sound 'on'
# Add Pomodoro status to the right side of the status
set -g status-right '#{pomodoro_status} | %H:%M'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
